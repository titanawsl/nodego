name: Deploy to Octopus

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      OCTOPUS_SPACE: 'Default'  # 改成你的 Space 名称

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ====== 这里放你的构建步骤 ======
      # 如果是前端项目:
      - name:  Build
        run: |
          npm install
          npm run build
      
      # 如果是 .NET 项目:
      # - name: Build
      #   run: |
      #     dotnet publish -c Release -o ./dist

      # 打包
      - name: Create Zip package
        uses: OctopusDeploy/create-zip-package-action@v3
        with:
          package_id: 'MyApp'          # 包名，后面在 Octopus 里要用
          version: '1.0.${{ github.run_number }}'
          output_folder: './packages/'
          base_path: './dist/'
          files: '**/*.*'

      # 推包到 Octopus
      - name: Push package
        uses: OctopusDeploy/push-package-action@v3
        with:
          server: ${{ secrets.OCTOPUS_URL }}
          api_key: ${{ secrets.OCTOPUS_API_KEY }}
          packages: 'packages/**/*.zip'

      # 创建 Release
      - name: Create Release
        uses: OctopusDeploy/create-release-action@v3
        with:
          server: ${{ secrets.OCTOPUS_URL }}
          api_key: ${{ secrets.OCTOPUS_API_KEY }}
          project: 'stake'         # 改成你在 Octopus 里创建的项目名
          release_number: '1.0.${{ github.run_number }}'

      # 部署到 Dev
      - name: Deploy to Dev
        uses: OctopusDeploy/deploy-release-action@v3
        with:
          server: ${{ secrets.OCTOPUS_URL }}
          api_key: ${{ secrets.OCTOPUS_API_KEY }}
          project: 'stake'
          release_number: '1.0.${{ github.run_number }}'
          environments: 'Dev'
